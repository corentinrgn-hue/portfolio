name: Update portfolio positioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-positioning.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update homepage positioning
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Portfolio de Corentin Régnier — concepteur de voyages, chef de projet tourisme outdoor et expériences de territoire.':
              'Portfolio de Corentin Régnier — projets au croisement du tourisme, de l’outdoor et du digital.',
              '<p class="eyebrow">Tourisme • itinérance • expériences outdoor</p>':
              '<p class="eyebrow">Tourisme • outdoor • digital</p>',
              '  Chef de projet<br>\n  tourisme & outdoor':
              '  Tourisme · Outdoor<br>\n  · Digital',
              'Professionnel du tourisme depuis plus de 7 ans, je conçois des voyages, des itinéraires et des expériences outdoor en m\'appuyant sur une double approche : l\'exploration du terrain et la gestion de projets touristiques.':
              'Je développe des projets au croisement du tourisme, de l\'outdoor et du digital. Mon parcours m\'a conduit à concevoir des voyages, développer des territoires et créer des solutions numériques au service des destinations et des acteurs du tourisme.',
              'Concepteur de voyages & chef de projet tourisme outdoor.':
              'Tourisme · Outdoor · Digital.'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Texte introuvable : {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/update-positioning.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-positioning.yml
          git commit -m "Refresh portfolio positioning [skip ci]"
          git push
